[tox]
envlist = py,quality
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
allowlist_externals =
	make
	touch
commands =
	make tests

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals =
	make
commands =
	make quality
